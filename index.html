<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Embedded GPU — Corrected Master Q&A Guide</title>
<style>
  :root {
    --bg: #0a0d12; --surface: #141821; --surface-raised: #1c2128; --surface-strong: #252b35;
    --border: #2a3038; --border-light: #3a414c;
    --text-primary: #e6edf3; --text-secondary: #adbac7; --text-tertiary: #768390;
    --nv-green: #76b900; --nv-green-soft: rgba(118,185,0,0.12);
    --cyan: #00d4ff; --cyan-soft: rgba(0,212,255,0.1);
    --purple: #b794f4; --purple-soft: rgba(183,148,244,0.1);
    --orange: #ff9b50; --orange-soft: rgba(255,155,80,0.1);
    --red: #ff6b6b; --red-soft: rgba(255,107,107,0.1);
    --yellow: #ffc857; --yellow-soft: rgba(255,200,87,0.1);
    --font-sans: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --font-mono: "JetBrains Mono","SF Mono","Fira Code",Consolas,monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body { font-family: var(--font-sans); background: var(--bg); color: var(--text-primary); line-height: 1.7; font-size: 15px; }
  .wrap { display: flex; min-height: 100vh; }
  .sidebar { width: 290px; background: var(--surface); border-right: 1px solid var(--border); padding: 24px 18px; position: fixed; top:0; left:0; bottom:0; overflow-y:auto; z-index:100; }
  .logo { font-size: 17px; font-weight: 800; letter-spacing: -0.3px; margin-bottom: 4px; color: var(--nv-green); }
  .logo-sub { font-size: 11px; color: var(--text-tertiary); margin-bottom: 20px; }
  .progress-wrap { margin-bottom: 18px; }
  .progress-bg { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .progress-fill { height:100%; background: linear-gradient(90deg, var(--nv-green), var(--cyan)); width:0%; transition: width 0.4s ease; }
  .progress-txt { font-size:11px; color:var(--text-tertiary); margin-top:6px; text-align:right; }
  .search-box { width:100%; padding:9px 13px; border-radius:8px; border:1px solid var(--border); background:var(--surface-raised); color:var(--text-primary); font-family:inherit; font-size:13px; margin-bottom:14px; outline:none; }
  .search-box:focus { border-color: var(--nv-green); }
  .search-results { position:absolute; top:125px; left:18px; right:18px; background:var(--surface-raised); border:1px solid var(--border); border-radius:10px; max-height:300px; overflow-y:auto; box-shadow:0 8px 24px rgba(0,0,0,0.5); display:none; z-index:200; }
  .search-result { padding:10px 14px; cursor:pointer; border-bottom:1px solid var(--border); font-size:13px; }
  .search-result:hover { background:var(--surface-strong); }
  .sr-title { font-weight:600; color:var(--text-primary); }
  .sr-snippet { color:var(--text-tertiary); font-size:12px; margin-top:2px; }
  .unit-btn { width:100%; text-align:left; padding:10px 14px; border-radius:8px; border:none; background:transparent; cursor:pointer; font-size:13px; font-weight:600; color:var(--text-secondary); transition:all 0.15s; font-family:inherit; display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; }
  .unit-btn:hover { background:var(--surface-raised); color:var(--text-primary); }
  .unit-btn.active { background:var(--surface-strong); color:var(--nv-green); }
  .unit-btn .ch { font-size:10px; color:var(--text-tertiary); transition:transform 0.2s; }
  .unit-btn.active .ch { transform: rotate(90deg); color:var(--nv-green); }
  .sec-list { margin-left:8px; margin-bottom:12px; display:none; }
  .sec-list.open { display:block; }
  .sec-link { display:block; padding:6px 12px 6px 22px; font-size:12px; color:var(--text-tertiary); text-decoration:none; border-radius:6px; transition:all 0.15s; cursor:pointer; border-left:2px solid transparent; line-height:1.4; }
  .sec-link:hover, .sec-link.active { color:var(--text-primary); background:var(--surface-raised); border-left-color:var(--nv-green); }
  .sec-link .tag-mini { display:inline-block; margin-left:6px; font-size:9px; padding:1px 5px; border-radius:3px; vertical-align:middle; }
  .sec-link .tag-mini.add { background:var(--yellow-soft); color:var(--yellow); }
  .sec-link .tag-mini.new { background:var(--cyan-soft); color:var(--cyan); }
  .sec-link .tag-mini.fix { background:var(--red-soft); color:var(--red); }
  .main { margin-left:290px; flex:1; padding:32px 48px; max-width:980px; }
  .mobile-toggle { display:none; position:fixed; top:14px; left:14px; z-index:300; background:var(--surface-strong); border:1px solid var(--border); color:var(--text-primary); padding:8px 12px; border-radius:8px; cursor:pointer; font-size:14px; }
  .overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:90; }
  .overlay.open { display:block; }

  .q-block { margin-bottom:48px; }
  .q-header { background:linear-gradient(135deg, var(--surface) 0%, var(--surface-raised) 100%); border:1px solid var(--border); border-left:4px solid var(--nv-green); border-radius:12px; padding:20px 24px; margin-bottom:24px; }
  .q-num { font-size:12px; font-weight:700; color:var(--nv-green); text-transform:uppercase; letter-spacing:0.8px; margin-bottom:6px; }
  .q-title { font-size:19px; font-weight:700; line-height:1.35; color:var(--text-primary); }
  .q-marks { display:inline-block; margin-top:10px; padding:3px 10px; border-radius:6px; background:var(--nv-green-soft); color:var(--nv-green); font-size:11px; font-weight:700; }
  h2 { font-size:18px; font-weight:700; margin-top:32px; margin-bottom:14px; color:var(--text-primary); padding-bottom:8px; border-bottom:1px solid var(--border); }
  h3 { font-size:16px; font-weight:700; margin-top:24px; margin-bottom:10px; color:var(--cyan); }
  h4 { font-size:14px; font-weight:700; margin-top:18px; margin-bottom:8px; color:var(--text-secondary); }
  p { margin-bottom:12px; color:var(--text-secondary); }
  ul, ol { margin-bottom:16px; padding-left:24px; color:var(--text-secondary); }
  li { margin-bottom:6px; }
  li strong { color:var(--text-primary); }
  code { font-family:var(--font-mono); font-size:13px; background:var(--surface-strong); padding:2px 6px; border-radius:4px; color:var(--nv-green); }
  .mark-tag { display:inline-block; padding:2px 8px; border-radius:5px; background:var(--cyan-soft); color:var(--cyan); font-size:11px; font-weight:700; margin-bottom:10px; }
  .note { border-left:3px solid var(--nv-green); padding:12px 16px; margin:14px 0; color:var(--text-secondary); font-size:13px; background:var(--nv-green-soft); border-radius:0 8px 8px 0; }
  .note strong { color:var(--nv-green); }
  .warn { border-left:3px solid var(--yellow); padding:12px 16px; margin:14px 0; color:var(--text-secondary); font-size:13px; background:var(--yellow-soft); border-radius:0 8px 8px 0; }
  .warn strong { color:var(--yellow); }
  .arch-note { border-left:3px solid var(--orange); padding:12px 16px; margin:14px 0; color:var(--text-secondary); font-size:12.5px; background:var(--orange-soft); border-radius:0 8px 8px 0; }
  .arch-note strong { color:var(--orange); }
  .add-tag { display:inline-block; padding:2px 8px; border-radius:5px; background:var(--yellow-soft); color:var(--yellow); font-size:10px; font-weight:700; margin-left:8px; vertical-align:middle; }
  .fix-tag { display:inline-block; padding:2px 8px; border-radius:5px; background:var(--red-soft); color:var(--red); font-size:10px; font-weight:700; margin-left:8px; vertical-align:middle; }
  .new-tag { display:inline-block; padding:2px 8px; border-radius:5px; background:var(--cyan-soft); color:var(--cyan); font-size:10px; font-weight:700; margin-left:8px; vertical-align:middle; }

  .code-block { background:#0d1117; border:1px solid var(--border); border-radius:10px; padding:16px; overflow-x:auto; margin:14px 0; position:relative; }
  .code-block pre { font-family:var(--font-mono); font-size:12.5px; line-height:1.6; color:#c9d1d9; margin:0; white-space:pre; }
  .code-block .kw { color:#ff7b72; }
  .code-block .type { color:#79c0ff; }
  .code-block .str { color:#a5d6ff; }
  .code-block .com { color:#8b949e; font-style:italic; }
  .code-block .fn { color:#d2a8ff; }
  .code-block .num { color:#79c0ff; }
  .code-block .macro { color:#ffa657; }
  .code-label { position:absolute; top:8px; right:12px; font-size:10px; color:var(--text-tertiary); font-family:var(--font-mono); background:var(--surface); padding:2px 8px; border-radius:4px; }
  .code-fix-marker { background:rgba(118,185,0,0.15); display:block; margin:0 -16px; padding:0 16px; border-left:3px solid var(--nv-green); }

  table { width:100%; border-collapse:collapse; margin:14px 0; font-size:12.5px; background:var(--surface); border-radius:8px; overflow:hidden; }
  th, td { padding:10px 12px; text-align:left; border-bottom:1px solid var(--border); vertical-align:top; }
  th { font-weight:700; color:var(--text-primary); background:var(--surface-raised); font-size:11px; text-transform:uppercase; letter-spacing:0.5px; }
  td { color:var(--text-secondary); }
  td strong { color:var(--nv-green); }
  tr:hover td { background:var(--surface-raised); }

  .diagram-box { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:24px; margin:20px 0; overflow-x:auto; }
  .diagram-title { text-align:center; font-size:12px; font-weight:700; color:var(--nv-green); text-transform:uppercase; letter-spacing:1px; margin-bottom:16px; }

  .mem-hierarchy { display:flex; flex-direction:column; align-items:center; gap:8px; }
  .mem-block { padding:14px 20px; border:1px solid var(--border); border-radius:8px; background:var(--surface-raised); text-align:center; min-width:380px; }
  .mem-block .mb-name { font-weight:700; font-size:13px; color:var(--text-primary); margin-bottom:4px; }
  .mem-block .mb-desc { font-size:11px; color:var(--text-tertiary); }
  .mem-block.host { border-color:var(--cyan); background:var(--cyan-soft); }
  .mem-block.host .mb-name { color:var(--cyan); }
  .mem-block.device { border-color:var(--purple); background:var(--purple-soft); }
  .mem-block.device .mb-name { color:var(--purple); }
  .mem-block.sm { border-color:var(--nv-green); background:var(--nv-green-soft); }
  .mem-block.sm .mb-name { color:var(--nv-green); }
  .mem-sub-blocks { display:flex; gap:8px; margin-top:8px; }
  .mem-sub { flex:1; padding:8px; border:1px solid var(--border); border-radius:6px; background:var(--surface); font-size:10px; text-align:center; }
  .mem-sub strong { display:block; color:var(--text-primary); margin-bottom:2px; }
  .mem-arrow { color:var(--text-tertiary); font-size:14px; }
  .mem-arrow span { font-size:10px; display:block; }

  .thread-grid-vis { display:flex; flex-direction:column; align-items:center; gap:12px; }
  .grid-box { border:2px solid var(--nv-green); border-radius:10px; padding:16px; background:var(--nv-green-soft); }
  .grid-label { text-align:center; font-weight:700; color:var(--nv-green); font-size:13px; margin-bottom:10px; }
  .blocks-row { display:flex; gap:12px; }
  .block-box { border:1px solid var(--cyan); border-radius:8px; padding:10px; background:var(--cyan-soft); }
  .block-label { text-align:center; font-weight:700; color:var(--cyan); font-size:11px; margin-bottom:8px; }
  .threads-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:3px; }
  .thread-cell { width:18px; height:18px; background:var(--surface-strong); border:1px solid var(--border-light); border-radius:3px; }
  .thread-cell.active { background:var(--nv-green); border-color:var(--nv-green); }

  .exec-flow { display:flex; flex-direction:column; gap:10px; }
  .exec-stage { padding:12px 16px; border:1px solid var(--border); border-radius:8px; background:var(--surface-raised); display:flex; align-items:center; gap:14px; }
  .exec-stage.host { border-left:4px solid var(--cyan); }
  .exec-stage.device { border-left:4px solid var(--nv-green); }
  .exec-stage-num { width:28px; height:28px; border-radius:50%; background:var(--nv-green); color:var(--bg); font-size:12px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .exec-stage.host .exec-stage-num { background:var(--cyan); }
  .exec-stage-content strong { color:var(--text-primary); font-size:13px; }
  .exec-stage-content div { font-size:11px; color:var(--text-tertiary); margin-top:2px; }
  .exec-arrow { text-align:center; color:var(--text-tertiary); font-size:14px; margin:-4px 0; }

  .sm-card { border:1px solid var(--nv-green); border-radius:8px; padding:12px; background:var(--nv-green-soft); min-width:200px; }
  .sm-card-title { text-align:center; font-weight:700; color:var(--nv-green); font-size:11px; margin-bottom:8px; }
  .sm-card-item { padding:6px 8px; background:var(--surface); border-radius:4px; margin-bottom:4px; font-size:10px; color:var(--text-secondary); text-align:center; }

  .multi-gpu-grid { display:flex; gap:16px; justify-content:center; flex-wrap:wrap; }
  .gpu-card { border:1px solid var(--purple); background:var(--purple-soft); border-radius:8px; padding:12px; min-width:200px; text-align:center; }
  .gpu-card-title { font-weight:700; color:var(--purple); font-size:12px; margin-bottom:6px; }
  .gpu-card-item { padding:5px 8px; background:var(--surface); border-radius:4px; margin-bottom:4px; font-size:10px; color:var(--text-secondary); }
  .p2p-link { color:var(--nv-green); font-size:18px; align-self:center; }

  .nvcc-flow { display:flex; flex-direction:column; align-items:center; gap:8px; }
  .nvcc-stage { padding:10px 18px; border:1px solid var(--nv-green); background:var(--nv-green-soft); border-radius:8px; font-size:12px; color:var(--text-primary); text-align:center; min-width:320px; }
  .nvcc-stage strong { color:var(--nv-green); }
  .nvcc-stage.host { border-color:var(--cyan); background:var(--cyan-soft); }
  .nvcc-stage.host strong { color:var(--cyan); }
  .nvcc-stage.device { border-color:var(--purple); background:var(--purple-soft); }
  .nvcc-stage.device strong { color:var(--purple); }
  .nvcc-arrow { color:var(--nv-green); font-size:14px; }

  .opencl-arch { display:flex; flex-direction:column; align-items:center; gap:10px; }
  .opencl-host { padding:14px 28px; border:2px solid var(--cyan); background:var(--cyan-soft); border-radius:8px; font-weight:700; color:var(--cyan); font-size:13px; }
  .opencl-devices { display:flex; gap:16px; flex-wrap:wrap; justify-content:center; }
  .opencl-device { border:1px solid var(--purple); background:var(--purple-soft); border-radius:8px; padding:12px; min-width:220px; }
  .opencl-device-title { text-align:center; font-weight:700; color:var(--purple); font-size:12px; margin-bottom:8px; }
  .cu-row { display:flex; gap:6px; }
  .cu-box { flex:1; padding:8px 4px; background:var(--surface); border:1px solid var(--border); border-radius:4px; text-align:center; font-size:9px; font-weight:600; color:var(--text-secondary); }
  .cu-pe { font-size:8px; color:var(--text-tertiary); margin-top:2px; }

  .csr-vis { display:flex; flex-direction:column; align-items:center; gap:16px; }
  .csr-matrix { display:grid; grid-template-columns:repeat(4,1fr); gap:3px; }
  .csr-cell { width:40px; height:40px; display:flex; align-items:center; justify-content:center; border:1px solid var(--border); border-radius:4px; font-family:var(--font-mono); font-size:13px; font-weight:600; }
  .csr-cell.nz { background:var(--nv-green-soft); border-color:var(--nv-green); color:var(--nv-green); }
  .csr-cell.zero { background:var(--surface); color:var(--text-tertiary); }
  .csr-arrays { display:flex; flex-direction:column; gap:10px; width:100%; max-width:500px; }
  .csr-array-row { display:flex; align-items:center; gap:10px; }
  .csr-array-label { font-family:var(--font-mono); font-size:11px; color:var(--cyan); min-width:90px; font-weight:600; }
  .csr-array-cells { display:flex; gap:3px; }
  .csr-array-cell { width:36px; height:28px; display:flex; align-items:center; justify-content:center; background:var(--surface-raised); border:1px solid var(--border); border-radius:4px; font-family:var(--font-mono); font-size:11px; color:var(--text-primary); }

  .scan-tree { display:flex; flex-direction:column; align-items:center; padding:16px 0; }
  .tree-phase-label { font-size:11px; font-weight:700; color:var(--nv-green); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:12px; }
  .tree-row { display:flex; gap:8px; justify-content:center; margin-bottom:6px; }
  .tree-node { width:36px; height:28px; display:flex; align-items:center; justify-content:center; border:1px solid var(--border); background:var(--surface-raised); border-radius:4px; font-family:var(--font-mono); font-size:10px; color:var(--text-secondary); }
  .tree-node.active { background:var(--nv-green-soft); border-color:var(--nv-green); color:var(--nv-green); font-weight:700; }
  .tree-node.root { background:var(--cyan-soft); border-color:var(--cyan); color:var(--cyan); }
  .tree-op { color:var(--text-tertiary); font-size:14px; align-self:center; }

  .conv-1d { display:flex; flex-direction:column; align-items:center; gap:12px; }
  .conv-array { display:flex; gap:2px; }
  .conv-elem { width:36px; height:36px; display:flex; align-items:center; justify-content:center; background:var(--surface-raised); border:1px solid var(--border); border-radius:4px; font-family:var(--font-mono); font-size:12px; color:var(--text-primary); }
  .conv-elem.masked { background:var(--nv-green-soft); border-color:var(--nv-green); color:var(--nv-green); font-weight:700; }
  .conv-elem.output { background:var(--cyan-soft); border-color:var(--cyan); color:var(--cyan); font-weight:700; }
  .conv-elem.ghost { background:var(--surface); border:1px dashed var(--border-light); color:var(--text-tertiary); }
  .conv-mask-label { font-size:11px; color:var(--text-tertiary); margin-top:4px; }
  .conv-formula { font-family:var(--font-mono); font-size:12px; color:var(--nv-green); background:var(--surface); padding:8px 14px; border-radius:6px; border:1px solid var(--border); margin:8px 0; }

  .self-tune-flow { display:flex; flex-direction:column; align-items:center; gap:8px; }
  .st-step { padding:10px 18px; border:1px solid var(--nv-green); background:var(--nv-green-soft); border-radius:8px; font-size:12px; color:var(--text-primary); text-align:center; min-width:280px; }
  .st-step strong { color:var(--nv-green); }
  .st-arrow { color:var(--nv-green); font-size:14px; }

  .dnn-pipeline { display:flex; align-items:center; gap:6px; flex-wrap:wrap; justify-content:center; }
  .dnn-stage { padding:12px 14px; border:1px solid var(--border); background:var(--surface-raised); border-radius:8px; text-align:center; min-width:130px; }
  .dnn-stage strong { display:block; color:var(--purple); font-size:12px; margin-bottom:4px; }
  .dnn-stage div { font-size:10px; color:var(--text-tertiary); }
  .dnn-arrow { color:var(--purple); font-size:16px; }

  .dp-tree { display:flex; flex-direction:column; align-items:center; gap:8px; padding:16px 0; }
  .dp-node { padding:10px 18px; border:1px solid var(--nv-green); background:var(--nv-green-soft); border-radius:8px; font-size:12px; color:var(--text-primary); }
  .dp-node.parent { border-color:var(--cyan); background:var(--cyan-soft); }
  .dp-node strong { color:var(--nv-green); }
  .dp-node.parent strong { color:var(--cyan); }
  .dp-children { display:flex; gap:12px; }
  .dp-arrow { color:var(--text-tertiary); font-size:14px; }

  .compare-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin:14px 0; }
  .compare-card { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:16px; }
  .compare-card h4 { margin-top:0; padding-bottom:8px; border-bottom:1px solid var(--border); text-align:center; color:var(--cyan); }

  .math-block { background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--purple); border-radius:8px; padding:14px 18px; margin:14px 0; text-align:center; font-family:var(--font-mono); font-size:14px; color:var(--text-primary); }
  .math-block .var { color:var(--cyan); }
  .math-block .op { color:var(--nv-green); }

  .top-nav { display:flex; justify-content:space-between; align-items:center; margin-top:32px; padding-top:16px; border-top:1px solid var(--border); }
  .nav-btn { padding:8px 16px; border-radius:8px; border:1px solid var(--border); background:var(--surface-raised); cursor:pointer; font-family:inherit; font-size:13px; color:var(--text-primary); transition:all 0.15s; }
  .nav-btn:hover { background:var(--surface-strong); border-color:var(--nv-green); }
  .nav-btn:disabled { opacity:0.3; cursor:not-allowed; }

  .flashcard { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:24px; margin:14px 0; cursor:pointer; transition:all 0.2s; min-height:120px; display:flex; flex-direction:column; justify-content:center; }
  .flashcard:hover { border-color:var(--nv-green); transform:translateY(-1px); }
  .fc-q { font-size:16px; font-weight:700; text-align:center; color:var(--text-primary); }
  .fc-a { font-size:13px; color:var(--text-secondary); text-align:center; margin-top:12px; display:none; line-height:1.6; }
  .flashcard.flipped .fc-q { display:none; }

<h2>1. CUDA Thread Hierarchy Breakdown</h2>
<p>CUDA uses a 3-tiered hierarchy to map computations to GPU hardware: <strong>Threads</strong>, <strong>Thread Blocks</strong>, and <strong>Grids</strong>.</p>

<h2>2. Thread Indexing Equations</h2>
<p>When launching a kernel, each thread calculates its unique 1D global index from built-in CUDA variables (<code>blockIdx</code>, <code>blockDim</code>, <code>threadIdx</code>):</p>

<div class="math-block">
  <span class="var">Global Thread Index</span> (i) = <span class="var">blockIdx.x</span> × <span class="var">blockDim.x</span> + <span class="var">threadIdx.x</span>
</div>

<p>For a 2D grid (e.g., image processing mapping to <code>(x,y)</code> pixel coordinates):</p>

<div class="math-block">
  <span class="var">row</span> (y) = <span class="var">blockIdx.y</span> × <span class="var">blockDim.y</span> + <span class="var">threadIdx.y</span><br>
  <span class="var">col</span> (x) = <span class="var">blockIdx.x</span> × <span class="var">blockDim.x</span> + <span class="var">threadIdx.x</span><br>
  <span class="var">Linearized Index</span> = y × width + x
</div>

<h2>3. C++ Code Example: Thread Indexing in Vector Addition</h2>

<div class="code-block">
  <span class="code-label">vector_add.cu</span>
  <pre><span class="com">// CUDA Kernel executing on GPU threads</span>
<span class="kw">__global__</span> <span class="type">void</span> <span class="fn">vectorAddKernel</span>(<span class="kw">const</span> <span class="type">float</span>* A, <span class="kw">const</span> <span class="type">float</span>* B, <span class="type">float</span>* C, <span class="type">int</span> N) {
    <span class="com">// 1. Calculate unique 1D thread index</span>
    <span class="type">int</span> i = blockIdx.x * blockDim.x + threadIdx.x;

    <span class="com">// 2. Boundary condition check</span>
    <span class="kw">if</span> (i &lt; N) {
        C[i] = A[i] + B[i];
    }
}

<span class="type">int</span> <span class="fn">main</span>() {
    <span class="type">int</span> N = <span class="num">1000000</span>;
    <span class="type">size_t</span> bytes = N * <span class="kw">sizeof</span>(<span class="type">float</span>);

    <span class="com">// Host &amp; Device pointers</span>
    <span class="type">float</span> *h_A, *h_B, *h_C;
    <span class="type">float</span> *d_A, *d_B, *d_C;

    <span class="com">// Allocate Host Memory</span>
    h_A = (<span class="type">float</span>*)<span class="fn">malloc</span>(bytes);
    h_B = (<span class="type">float</span>*)<span class="fn">malloc</span>(bytes);
    h_C = (<span class="type">float</span>*)<span class="fn">malloc</span>(bytes);

    <span class="com">// Allocate Device Memory</span>
    <span class="fn">cudaMalloc</span>(&amp;d_A, bytes);
    <span class="fn">cudaMalloc</span>(&amp;d_B, bytes);
    <span class="fn">cudaMalloc</span>(&amp;d_C, bytes);

    <span class="com">// Copy data from Host to Device</span>
    <span class="fn">cudaMemcpy</span>(d_A, h_A, bytes, cudaMemcpyHostToDevice);
    <span class="fn">cudaMemcpy</span>(d_B, h_B, bytes, cudaMemcpyHostToDevice);

    <span class="com">// 3. Thread Configuration: 256 threads per block</span>
    <span class="type">int</span> threadsPerBlock = <span class="num">256</span>;
    <span class="type">int</span> blocksPerGrid = (N + threadsPerBlock - <span class="num">1</span>) / threadsPerBlock;

    <span class="com">// Launch Kernel on GPU</span>
    <span class="fn">vectorAddKernel</span>&lt;&lt;&lt;blocksPerGrid, threadsPerBlock&gt;&gt;&gt;(d_A, d_B, d_C, N);

    <span class="com">// Copy result back to Host</span>
    <span class="fn">cudaMemcpy</span>(h_C, d_C, bytes, cudaMemcpyDeviceToHost);

    <span class="com">// Free GPU Memory</span>
    <span class="fn">cudaFree</span>(d_A); <span class="fn">cudaFree</span>(d_B); <span class="fn">cudaFree</span>(d_C);
    <span class="fn">free</span>(h_A); <span class="fn">free</span>(h_B); <span class="fn">free</span>(h_C);

    <span class="kw">return</span> <span class="num">0</span>;
}</pre>
</div>

<div class="note">

</div>

<div class="q-block">
<div class="q-header">

<h2>(a) Self-Tuning CUDA Applications [5 Marks]</h2>
<p><em>Source: Unit III PDF — "Self-tuning Applications" subsection under Optimizing CUDA Applications.</em></p>
<p>A <strong>Self-Tuning (or Auto-Tuning) CUDA application</strong> dynamically adjusts its configuration and parameters — such as block sizes, grid dimensions, tile sizes, and thread layouts — to maximize performance, efficiency, or other desired metrics without manual intervention. The PDF describes this as adapting application parameters based on the specific GPU architecture, data size, and workload.</p>

<div class="diagram-box">
  <div class="diagram-title">Self-Tuning Application Workflow</div>
  <div class="self-tune-flow">
    <div class="st-step"><strong>1. Query GPU Properties</strong><br><code>cudaGetDeviceProperties()</code> — read hardware limits at runtime</div>
    <div class="st-arrow">↓</div>
    <div class="st-step"><strong>2. Evaluate Workload &amp; Data Size</strong><br>Analyze input dimensions</div>
    <div class="st-arrow">↓</div>
    <div class="st-step"><strong>3. Use Occupancy Calculator / Profiler</strong><br>Helps fine-tune parameters for different GPUs</div>
    <div class="st-arrow">↓</div>
    <div class="st-step"><strong>4. Compute Optimal Configuration</strong><br>Determine Block Size, Grid Size, Dynamic Shared Memory</div>
    <div class="st-arrow">↓</div>
    <div class="st-step"><strong>5. Launch Tuned Kernel Configuration</strong><br><code>kernel&lt;&lt;&lt;grid, block&gt;&gt;&gt;(...)</code></div>
  </div>
</div>

<h3>Key Mechanisms (from the PDF)</h3>
<ul>
  <li><strong>Device Property Querying:</strong> Uses <code>cudaGetDeviceProperties()</code> to query hardware limits at runtime (e.g., maximum threads per SM, available shared memory, register limits).</li>
  <li><strong>Occupancy Calculator &amp; Profiler:</strong> The PDF recommends using CUDA's occupancy calculator and occupancy profiler to help fine-tune parameters for different GPUs.</li>
  <li><strong>Adaptive Parameters:</strong> Adjusts algorithm parameters (such as matrix tile sizes) based on the GPU the application is running on — useful when the same code must run on a low-power embedded GPU and a high-end data center GPU.</li>
</ul>

<h2>(b) Problem Decomposition in CUDA with Example [5 Marks]</h2>
<p><em>Source: Unit III PDF — "Problem Decomposition" subsection.</em></p>
<p><strong>Problem Decomposition</strong> is the process of breaking a computational problem into smaller, independent tasks that can be executed in parallel by GPU threads. The PDF describes a "Divide and Conquer" approach.</p>

<h3>Decomposition Strategy (per the PDF)</h3>
<ol>
  <li><strong>Divide and Conquer:</strong> Break the computational problem into smaller, independent tasks that can be executed in parallel. Identify opportunities for parallelism within the algorithm.</li>
  <li><strong>Work Distribution:</strong> Distribute tasks evenly among GPU threads, ensuring load balance and efficient resource utilization.</li>
  <li><strong>Divide into Work Units:</strong> Divide the problem into smaller work units that can be executed by individual GPU threads.</li>
  <li><strong>Thread Blocks and Grids:</strong> Organize these work units into thread blocks and grids. Thread blocks are groups of threads that can communicate and synchronize; grids organize thread blocks for execution. The structure should be designed based on the problem and the available GPU resources.</li>
</ol>

<h3>Example: 2D Matrix Addition (C = A + B)</h3>

<div class="code-block">
  <span class="code-label">matrix_add.cu</span>
  <pre><span class="com">// Decomposing a 2D Matrix Addition problem across a 2D Grid of Thread Blocks</span>
<span class="kw">__global__</span> <span class="type">void</span> <span class="fn">matrixAddKernel</span>(<span class="type">float</span>* A, <span class="type">float</span>* B, <span class="type">float</span>* C, <span class="type">int</span> width, <span class="type">int</span> height) {
    <span class="com">// Map thread indices to 2D matrix coordinates</span>
    <span class="type">int</span> col = blockIdx.x * blockDim.x + threadIdx.x;
    <span class="type">int</span> row = blockIdx.y * blockDim.y + threadIdx.y;

    <span class="com">// Work unit: Each thread computes exactly one cell, with boundary guard</span>
    <span class="kw">if</span> (col &lt; width &amp;&amp; row &lt; height) {
        <span class="type">int</span> index = row * width + col;
        C[index] = A[index] + B[index];
    }
}

<span class="type">void</span> <span class="fn">launchDecomposedKernel</span>(<span class="type">float</span>* d_A, <span class="type">float</span>* d_B, <span class="type">float</span>* d_C, <span class="type">int</span> width, <span class="type">int</span> height) {
    <span class="com">// Define 2D Block and Grid Dimensions</span>
    <span class="type">dim3</span> threadsPerBlock(<span class="num">16</span>, <span class="num">16</span>); <span class="com">// 256 threads per block</span>
    <span class="type">dim3</span> blocksPerGrid((width + <span class="num">15</span>) / <span class="num">16</span>, (height + <span class="num">15</span>) / <span class="num">16</span>);

    <span class="fn">matrixAddKernel</span>&lt;&lt;&lt;blocksPerGrid, threadsPerBlock&gt;&gt;&gt;(d_A, d_B, d_C, width, height);
}</pre>
</div>

<div class="note">
  <strong>Why 2D Decomposition?</strong> For 2D data like images or matrices, a 2D grid of 2D blocks maps naturally to the (x,y) coordinate system, making thread-to-element mapping intuitive and enabling efficient shared memory tiling for neighboring pixel operations.
</div>
</div>
          `

<h2>2. Detailed Stage-by-Stage Workflow Breakdown</h2>

<h3>Stage 1: Memory Allocation and Data Transfer (CPU Side)</h3>
<p>Before GPU execution, memory allocation and data transfer are required. The CPU allocates memory in the GPU's DRAM using <code>cudaMalloc()</code>. Data that needs to be processed by the GPU is transferred from the CPU's main memory (RAM) to the GPU's DRAM (device memory) via <code>cudaMemcpy()</code> using the direction flag <code>cudaMemcpyHostToDevice</code>.</p>

<h3>Stage 2: Kernel Launch &amp; Hardware Dispatch</h3>
<p>The CPU launches a kernel on the GPU, specifying the number of thread blocks and threads per block. These parameters define the total number of threads that will be used to execute the kernel. The kernel is executed concurrently by multiple threads following a data-parallel execution model. The GPU's hardware scheduler accepts the kernel launch command and distributes the workload's thread blocks across available SMs based on hardware capacity.</p>

<h3>Stage 3: Thread Block Allocation &amp; SIMT Warp Execution</h3>
<ul>
  <li>Each thread block is assigned to an SM, and the threads within that block are executed in parallel on the SM.</li>
  <li>The SM manages the execution of threads and warps (groups of 32 threads) within the thread block.</li>
  <li>Threads within a warp execute the same instruction but can operate on different data elements — taking advantage of SIMD (Single Instruction, Multiple Data) processing. (CUDA calls this <strong>SIMT</strong> — Single Instruction, Multiple Threads.)</li>
</ul>

<h3>Stage 4: Memory Hierarchy &amp; Barrier Synchronization</h3>
<p>Threads can access different levels of memory within the GPU: registers (fastest, per-thread), shared memory (shared within a thread block), and global memory (accessible by all threads). Threads within a thread block can be synchronized using barriers (e.g., <code>__syncthreads()</code> in CUDA) to ensure proper coordination and data sharing.</p>

<h3>Stage 5: Thread Completion &amp; Data Transfer Back</h3>
<p>When all threads within a thread block complete their work, they may be scheduled to execute another kernel if necessary. After kernel execution, the processed data or results are transferred back to the CPU's main memory using <code>cudaMemcpy()</code> with the <code>cudaMemcpyDeviceToHost</code> flag.</p>

<div class="note">
  <strong>Summary (per PDF):</strong> The execution model is characterized by massive parallelism and the efficient use of threads, with each thread executing the same instruction on different data elements. Memory access and data movement are essential considerations for optimizing GPU performance. Proper synchronization and memory management are crucial for efficient GPU computation.
</div>
</div>

<h2>2. CUDA Multi-GPU Programming Model</h2>

<h2>Memory Considerations</h2>
<ul>
  <li><strong>Memory Hierarchy:</strong> Registers (fastest, private), shared memory (fast, per-block), local memory (fallback), global memory (largest, off-chip, highest latency).</li>
  <li><strong>Register Usage:</strong> Too many registers per thread leads to <em>register spilling</em> into local memory, degrading performance. Minimize via type optimization, loop unrolling, and inlining.</li>
  <li><strong>Shared Memory:</strong> Faster than global but limited. Optimize access patterns to minimize <em>bank conflicts</em>. Use it for caching frequently accessed data.</li>
  <li><strong>Local Memory:</strong> A fallback for variables that don't fit in registers or shared memory. Slower than shared memory. Minimize its use.</li>
  <li><strong>Global Memory Access:</strong> Accesses should be <em>coalesced</em> — adjacent threads access adjacent memory locations.</li>
  <li><strong>Memory Padding:</strong> Align data structures to cache line size to improve access efficiency.</li>
  <li><strong>Memory Copy Optimization:</strong> Use asynchronous copies to overlap transfer with computation. Use pinned memory to reduce transfer overhead.</li>
  <li><strong>Constant &amp; Texture Memory:</strong> Use for read-only frequently-accessed data; cached and optimized for specific patterns.</li>
</ul>

<h2>Data Transfers</h2>
<ul>
  <li><strong>Minimize Data Transfer:</strong> Reduce unnecessary transfers between CPU and GPU.</li>
  <li><strong>Asynchronous Transfers:</strong> Use async transfers to overlap data transfer and kernel execution.</li>
</ul>

<h2>Thread Usage</h2>
<ul>
  <li><strong>Thread Granularity:</strong> Choose appropriate block size. Smaller blocks can maximize occupancy for some workloads.</li>
  <li><strong>Warp-level Optimization:</strong> Avoid warp divergence — minimize branching within warps.</li>
  <li><strong>Thread Synchronization:</strong> Use <code>__syncthreads()</code> judiciously; excessive synchronization impacts performance.</li>
</ul>

<h2>Resource Contentions</h2>
<ul>
  <li><strong>Register Pressure:</strong> Exceeding available registers causes spilling to global memory.</li>
  <li><strong>Shared Memory Bank Conflicts:</strong> Minimize by accessing shared memory with coalesced patterns.</li>
</ul>

<h3>Mitigation Strategies (from the Resource Contentions subsection)</h3>
<ul>
  <li><strong>Fine-Grained Locking:</strong> Split large critical sections into smaller independently-accessed sections.</li>
  <li><strong>Lock-Free / Wait-Free Data Structures:</strong> e.g., lock-free queues and stacks.</li>
  <li><strong>Thread Pooling:</strong> Control the number of concurrent threads to prevent CPU/context-switch contention.</li>
  <li><strong>Memory Locality:</strong> Allocate data in a cache-friendly manner; use padding to reduce cache thrashing.</li>
  <li><strong>Asynchronous I/O:</strong> Mitigate I/O contention by allowing threads to continue processing while waiting on I/O.</li>
  <li><strong>Resource Allocation &amp; Scheduling:</strong> Allocate resources based on priorities or usage patterns.</li>
  <li><strong>Parallel Algorithms:</strong> Use efficient data partitioning and divide-and-conquer.</li>
</ul>

<h2>Kernel Launch Configuration</h2>
<ul>

<div class="q-block">
<div class="q-header">
  <div class="q-num">Question 7 · Regular Paper</div>
  <div class="q-title">(a) What are resource contention issues and how to avoid them? (b) Discuss algorithmic issues in parallel programming.</div>
  <div class="q-marks">5M + 5M · CO-3,4</div>
</div>

<h2>(a) Resource Contention Issues &amp; Mitigation [5 Marks]</h2>
<p><em>Source: Unit III PDF "Resource Contentions" + Unit IV PDF parallel programming issues.</em></p>
<p><strong>Definition:</strong> Resource contention occurs when multiple threads or processes compete for access to a shared resource — memory, CPU cores, hardware devices, or synchronization primitives — leading to performance degradation, synchronization issues, and bottlenecks.</p>

<h3>Types of Resource Contention</h3>
<ul>
  <li><strong>Memory Contention:</strong> Multiple threads compete for memory access → cache thrashing, inefficient bandwidth use.</li>
  <li><strong>CPU Contention:</strong> Threads compete for CPU cores → thread queuing, execution delays.</li>
  <li><strong>I/O Contention:</strong> Threads contend for disks or network interfaces.</li>
  <li><strong>Synchronization Contention:</strong> Threads contend for locks or semaphores → deadlocks or excessive waiting.</li>
</ul>

<h3>GPU-Specific Contention (from Unit III PDF)</h3>
<table>
  <tr><th>Contention Type</th><th>Cause</th><th>Mitigation</th></tr>
  <tr>
    <td><strong>Register Pressure</strong></td>
    <td>Exceeding per-thread register limits</td>
    <td>Spilling to local memory; optimize variable scopes, tune block size</td>
  </tr>
  <tr>
    <td><strong>Shared Memory Bank Conflicts</strong></td>
    <td>Multiple threads in a warp access different words in the same bank</td>
    <td>Padding data structures; altering access strides</td>
  </tr>
  <tr>
    <td><strong>Global Memory Bandwidth</strong></td>
    <td>Multiple warps saturate DRAM bus</td>
    <td>Coalesced accesses; reuse data in shared memory</td>
  </tr>
</table>

<h3>General Mitigation Strategies (from PDF)</h3>
<ul>
  <li><strong>Fine-Grained Locking:</strong> Split a large critical section into smaller independent sections.</li>
  <li><strong>Lock-Free / Wait-Free Data Structures:</strong> Lock-free queues and stacks reduce sync overhead.</li>
  <li><strong>Thread Pooling:</strong> Control concurrent thread count to prevent CPU/context-switch contention.</li>
  <li><strong>Memory Locality:</strong> Cache-friendly allocation; padding to reduce thrashing.</li>
  <li><strong>Asynchronous I/O:</strong> Overlap I/O with computation.</li>
  <li><strong>Resource Allocation &amp; Scheduling:</strong> Allocate based on priorities/usage.</li>
  <li><strong>Parallel Algorithms:</strong> Divide-and-conquer with efficient partitioning.</li>
</ul>

<h2>(b) Algorithmic Issues in Parallel Programming [5 Marks]</h2>
<p><em>Source: Unit IV PDF — "Algorithmic Issues" section.</em></p>

<ul>
  <li><strong>Load Imbalance:</strong> Computational work is not evenly distributed. Some threads finish much earlier than others → underutilized resources. <em>Example: parallel loop where one thread processes significantly more elements.</em></li>
  <li><strong>Scalability Limitations:</strong> Some algorithms don't scale efficiently with increasing processing units. <em>Example: high inter-thread communication overhead; algorithms relying on global synchronization don't scale with more GPUs.</em></li>
  <li><strong>Memory Access Patterns:</strong> Inefficient patterns cause cache misses and memory contention. <em>Example: matrix multiplication with non-coalesced CUDA accesses.</em></li>
  <li><strong>Communication Overhead:</strong> Frequent data exchange between threads/processes becomes a bottleneck. <em>Example: excessive message passing in distributed systems; frequent host↔device transfers.</em></li>
  <li><strong>Task Granularity:</strong> Choosing appropriate task size. Too fine → overhead outweighs benefit. Too coarse → load imbalance.</li>
  <li><strong>Amdahl's Law Limitations:</strong> Speedup is bounded by the serial (non-parallelizable) fraction of the algorithm.</li>
  <li><strong>Data Dependencies:</strong> Iterative algorithms where each iteration depends on the previous limit parallelism.</li>
</ul>

<div class="math-block">
  <span class="var">Amdahl's Law:</span> Speedup = <span class="num">1</span> / [(<span class="num">1</span> - P) + P/N]<br>
  <span style="font-size:11px; color:var(--text-tertiary);">where P = parallel fraction, N = number of processors</span>
</div>

<div class="note">
  <strong>Resolution (per PDF):</strong> Addressing algorithmic issues requires careful algorithm design, load balancing techniques, minimizing communication overhead, optimizing memory access patterns, and considering scalability. Parallel algorithms need to be analyzed, profiled, and optimized.
</div>
</div>
          `

<div class="q-block">
<div class="q-header">
  <div class="q-num">Question 8 · Regular Paper <span class="fix-tag">FIXED</span></div>
  <div class="q-title">Explain the importance of CUDA error handling with examples.</div>
  <div class="q-marks">10M · CO-3,4</div>

<h2>1. Why CUDA Error Handling is Critical</h2>
<p><em>Source: Unit IV PDF — "CUDA Error Handling" section.</em></p>
<p>Unlike traditional CPU programming where runtime failures often throw exceptions or terminate threads immediately, GPU executions operate asynchronously across independent hardware queues. Without structured error handling:</p>
<ul>
  <li>Invalid memory accesses or failed kernel configurations fail silently or crash application drivers unpredictably.</li>
  <li>Debugging memory corruption or synchronization faults becomes extremely difficult without catching error codes at their source.</li>
</ul>

<div class="warn">
  <strong>Correction:</strong> The earlier HTML used <code>d_out[idx] = 100.0f / (float)idx;</code> as a "CUDA error" demonstration. That is <em>not</em> a CUDA runtime error — IEEE-754 float division by zero produces <code>Inf</code>, not a synchronous GPU fault. The example below uses a <strong>genuine out-of-bounds device-memory access</strong>, which triggers a real recoverable CUDA error (<code>cudaErrorIllegalAddress</code>) on <code>cudaDeviceSynchronize()</code>.
</div>

<h2>2. Comprehensive CUDA Error Handling Code Example</h2>

<div class="code-block">
  <span class="code-label">error_handling.cu</span>
  <pre><span class="macro">#include</span> <span class="str">&lt;stdio.h&gt;</span>
<span class="macro">#include</span> <span class="str">&lt;cuda_runtime.h&gt;</span>

<span class="com">// Helper error checking macro</span>
<span class="macro">#define</span> <span class="fn">CUDA_CHECK</span>(ans) { <span class="fn">gpuAssert</span>((ans), __FILE__, __LINE__); }
<span class="kw">inline</span> <span class="type">void</span> <span class="fn">gpuAssert</span>(<span class="type">cudaError_t</span> code, <span class="kw">const</span> <span class="type">char</span> *file, <span class="type">int</span> line, <span class="type">bool</span> abort=<span class="kw">true</span>) {
    <span class="kw">if</span> (code != cudaSuccess) {
        <span class="fn">fprintf</span>(stderr, <span class="str">"CUDA_CHECK failed: %s %s %d\n"</span>, <span class="fn">cudaGetErrorString</span>(code), file, line);
        <span class="kw">if</span> (abort) <span class="fn">exit</span>(code);
    }
}

<span class="com">// Kernel that deliberately performs an out-of-bounds write.</span>
<span class="com">// The bad write only happens for thread idx == 0; this is a genuine</span>
<span class="com">// illegal-address access that the GPU reports as cudaErrorIllegalAddress.</span>
<span class="kw">__global__</span> <span class="type">void</span> <span class="fn">faultyKernel</span>(<span class="type">float</span> *d_out, <span class="type">int</span> N) {
    <span class="type">int</span> idx = blockIdx.x * blockDim.x + threadIdx.x;
    <span class="kw">if</span> (idx == <span class="num">0</span>) {
        <span class="com">// Deliberately write beyond the allocated buffer.</span>
        <span class="com">// This triggers an asynchronous illegal-address error.</span>
        d_out[N + <span class="num">1000</span>] = <span class="num">42.0f</span>;
    }
}

<span class="type">int</span> <span class="fn">main</span>() {
    <span class="type">int</span> N = <span class="num">1024</span>;
    <span class="type">size_t</span> size = N * <span class="kw">sizeof</span>(<span class="type">float</span>);
    <span class="type">float</span> *d_out = <span class="kw">NULL</span>;

    <span class="com">// 1. Checking API Call Errors (cudaMalloc)</span>
    <span class="type">cudaError_t</span> err = <span class="fn">cudaMalloc</span>((<span class="type">void</span>**)&amp;d_out, size);
    <span class="kw">if</span> (err != cudaSuccess) {
        <span class="fn">printf</span>(<span class="str">"Device memory allocation failed: %s\n"</span>, <span class="fn">cudaGetErrorString</span>(err));
        <span class="kw">return</span> -<span class="num">1</span>;
    }
    <span class="fn">CUDA_CHECK</span>(<span class="fn">cudaMemset</span>(d_out, <span class="num">0</span>, size));

    <span class="com">// 2. Launching Kernel Asynchronously</span>
    <span class="type">int</span> threadsPerBlock = <span class="num">256</span>;
    <span class="type">int</span> blocksPerGrid = (N + threadsPerBlock - <span class="num">1</span>) / threadsPerBlock;

    <span class="fn">faultyKernel</span>&lt;&lt;&lt;blocksPerGrid, threadsPerBlock&gt;&gt;&gt;(d_out, N);

    <span class="com">// 3. Catching Kernel Launch Errors immediately after launch</span>
    <span class="type">cudaError_t</span> launchErr = <span class="fn">cudaGetLastError</span>();
    <span class="kw">if</span> (launchErr != cudaSuccess) {
        <span class="fn">printf</span>(<span class="str">"Kernel launch error detected: %s\n"</span>, <span class="fn">cudaGetErrorString</span>(launchErr));
    }

    <span class="com">// 4. Catching Asynchronous Execution Errors via Synchronization.</span>
    <span class="com">//    The illegal-address fault above is reported here.</span>
    <span class="type">cudaError_t</span> syncErr = <span class="fn">cudaDeviceSynchronize</span>();
    <span class="kw">if</span> (syncErr != cudaSuccess) {
        <span class="fn">printf</span>(<span class="str">"Asynchronous execution error detected post-sync: %s\n"</span>, <span class="fn">cudaGetErrorString</span>(syncErr));
    }

    <span class="com">// Cleanup</span>
    <span class="fn">CUDA_CHECK</span>(<span class="fn">cudaFree</span>(d_out));
    <span class="fn">printf</span>(<span class="str">"CUDA program executed and error checked.\n"</span>);
    <span class="kw">return</span> <span class="num">0</span>;
}</pre>
</div>

<h2>3. Summary of Key Error APIs Used</h2>

<table>
  <tr><th>API Function</th><th>Purpose</th></tr>
  <tr>
    <td><code>cudaGetLastError()</code></td>
    <td>Returns the latest error code logged by the runtime for the current thread, <strong>clearing</strong> the status.</td>
  </tr>
  <tr>
    <td><code>cudaPeekAtLastError()</code></td>
    <td>Inspects the error register <strong>without clearing</strong> it.</td>
  </tr>
  <tr>
    <td><code>cudaDeviceSynchronize()</code></td>
    <td>Forces host-device synchronization; waits for all prior kernel queues to finish and reports any underlying execution faults.</td>
  </tr>
  <tr>
    <td><code>cudaStreamQuery()</code></td>
    <td>For stream-scoped error checking — returns <code>cudaSuccess</code> only if all operations in the stream completed successfully.</td>
  </tr>
  <tr>
    <td><code>cudaGetErrorString()</code></td>
    <td>Converts an error code into a human-readable string for logging.</td>
  </tr>
</table>

<div class="warn">
  <strong>Critical Pattern:</strong> Always use the two-step error check after every kernel launch: (1) <code>cudaGetLastError()</code> catches configuration/launch errors immediately, then (2) <code>cudaDeviceSynchronize()</code> catches asynchronous runtime errors that occurred during actual GPU execution. Without step 2, illegal-address faults and similar async errors are silently lost.
</div>
</div>
          `

<div class="q-block">
<div class="q-header">

<div class="warn">
  <strong>Why this section exists:</strong> The Unit IV PDF contains a substantial NVCC compilation and compatibility section that the earlier HTML did not cover. This is the PDF material added back.

<h2>1. NVCC Compilation Workflow</h2>
<p>NVCC (NVIDIA CUDA Compiler) is the specialized compiler that translates CUDA code into machine code executable on NVIDIA GPUs. The workflow:</p>

<div class="diagram-box">
  <div class="diagram-title">NVCC Compilation Workflow</div>
  <div class="nvcc-flow">
    <div class="nvcc-stage host"><strong>1. .cu Source File</strong><br>Contains both host C/C++ and device CUDA kernels</div>
    <div class="nvcc-arrow">↓</div>
    <div class="nvcc-stage"><strong>2. Preprocessing</strong><br>Macro expansion, includes</div>
    <div class="nvcc-arrow">↓</div>
    <div class="nvcc-stage host"><strong>3. Host Code Compilation</strong><br>Compiled by host C/C++ compiler (GCC/MSVC) → host object files</div>
    <div class="nvcc-arrow">↓</div>
    <div class="nvcc-stage device"><strong>4. Device Code → PTX</strong><br>Compiled into PTX (Parallel Thread Execution) intermediate representation</div>
    <div class="nvcc-arrow">↓</div>
    <div class="nvcc-stage device"><strong>5. PTX → SASS (JIT at runtime)</strong><br>Just-In-Time compilation by GPU driver into native machine code (SASS)</div>
    <div class="nvcc-arrow">↓</div>
    <div class="nvcc-stage"><strong>6. Linking</strong><br>Host object files + device code + CUDA runtime libraries → final executable</div>
  </div>
</div>

<h3>Compilation Command</h3>
<div class="code-block">
<pre>nvcc -o my_cuda_program my_cuda_code.cu</pre>
</div>

<h3>Common NVCC Options</h3>
<ul>
  <li><code>-arch=sm_XX</code>: Specifies compute capability (e.g., <code>-arch=sm_61</code> for Pascal 6.1).</li>
  <li><code>-Xcompiler</code>: Passes options to the underlying host compiler (e.g., <code>-Xcompiler -std=c++17</code>).</li>
  <li><code>-rdc</code>: Enables relocatable device code for separate compilation units.</li>
  <li><code>-L</code> / <code>-l</code>: Library paths and library names for external dependencies.</li>
</ul>

<h2>2. PTX (Parallel Thread Execution)</h2>
<ul>
  <li>PTX is an <strong>architecture-independent</strong> intermediate representation.</li>
  <li>Serves as an abstraction layer between high-level CUDA source and low-level GPU-specific machine code (SASS).</li>
  <li>At runtime, PTX is JIT-compiled into SASS by the GPU driver, optimized for the specific GPU's architecture.</li>
</ul>

<h2>3. Binary Compatibility</h2>
<ul>
  <li>PTX code can execute on any GPU with <strong>compute capability ≥</strong> the one targeted during PTX generation.</li>
  <li>PTX generated for sm_61 runs on sm_61, sm_70, sm_80, etc. — but is <strong>not guaranteed</strong> to run on lower compute capabilities.</li>
  <li><strong>Dynamic Parallelism (CDP)</strong> can introduce subtle incompatibilities because inner kernels are compiled at runtime; disable CDP when broad compatibility is required.</li>
  <li>GPU feature variations (atomic operations, memory instructions) may exist between architectures — functional differences are possible.</li>
</ul>

<h2>4. PTX Compatibility</h2>
<ul>
  <li>PTX is designed to be compatible across NVIDIA GPUs with compatible compute capabilities.</li>
  <li>A single binary can be distributed and executed on different NVIDIA GPUs <strong>without recompilation</strong>, as long as compute capability is sufficient.</li>
  <li>JIT compilation tailors PTX to the specific GPU's architecture.</li>
</ul>

<h2>5. Application Compatibility</h2>
<ul>
  <li><strong>Compute Capability Targeting:</strong> Target lower CC for broader compatibility; target higher CC for newer features.</li>
  <li><strong>PTX + JIT Compilation:</strong> Distribute precompiled binaries that execute on various GPUs via JIT.</li>
  <li><strong>Memory &amp; Resource Management:</strong> Avoid leaks; correct transfers; manage shared resources.</li>
  <li><strong>Precision &amp; Error Handling:</strong> Consistent FP precision; robust error handling.</li>
  <li><strong>API Compatibility:</strong> CUDA runtime/driver APIs are backward compatible — apps compiled against older CUDA continue to run on newer versions.</li>
</ul>

<h2>6. C++ Compatibility</h2>
<ul>
  <li>CUDA C++ extends C++ for both host and device code.</li>
  <li>Supports C++ Standard Library (data structures, algorithms) — though not all features are supported in device code.</li>
  <li>Modern C++ features: lambdas, range-based for loops, auto, smart pointers.</li>
  <li><strong>No C++ exceptions (try-catch) in device code.</strong> Use CUDA-specific error handling.</li>
  <li>Namespaces and classes supported; some restrictions on inheritance, virtual functions, complex data structures in kernels.</li>
  <li>Separate compilation units via <code>-rdc</code>.</li>
  <li>Template metaprogramming supported.</li>
</ul>

<h2>7. 64-Bit Compatibility</h2>
<ul>
  <li>CUDA fully supports 64-bit host and device code.</li>
  <li>Large memory spaces; 64-bit integer types (<code>long long</code>); 64-bit floating point (<code>double</code>).</li>
  <li>Significantly larger addressable memory than 32-bit mode.</li>
  <li>CUDA libraries (cuBLAS, cuDNN, cuFFT) fully support 64-bit data types and addressing.</li>
</ul>

<h2>8. CUDA Runtime</h2>
<p>The CUDA Runtime is the software layer that bridges host code and GPU hardware.</p>
<h3>Key Components</h3>
<ul>
  <li><strong>Device Management:</strong> Query and manage GPUs; <code>cudaGetDeviceProperties</code>, <code>cudaSetDevice</code>.</li>
  <li><strong>Memory Management:</strong> <code>cudaMalloc</code>, <code>cudaMemcpy</code>, <code>cudaFree</code>.</li>
  <li><strong>Kernel Execution:</strong> <code>&lt;&lt;&lt;...&gt;&gt;&gt;</code> syntax or <code>cudaLaunchKernel</code>.</li>
  <li><strong>Synchronization:</strong> <code>cudaDeviceSynchronize</code>, <code>cudaStreamSynchronize</code>.</li>
  <li><strong>Error Handling:</strong> <code>cudaGetLastError</code>, <code>cudaPeekAtLastError</code>.</li>
</ul>
<h3>Runtime API vs Driver API</h3>
<ul>
  <li><strong>Runtime API (High-Level):</strong> Simpler, commonly used for most CUDA apps.</li>
  <li><strong>Driver API (Low-Level):</strong> Finer-grained control; used for specific use cases requiring advanced control.</li>
</ul>

<h2>9. Case Study: Image Feature Extraction (Sobel Edge Detection)</h2>
<p><em>Source: Unit IV PDF — "CASE STUDY" section.</em></p>
<p>The PDF presents a CUDA implementation of Sobel edge detection. Each GPU thread maps to an output pixel, computes the gradient in x and y directions using Sobel 3×3 masks, and writes the magnitude. The kernel launch uses a 2D grid (e.g., 16×16 blocks) and the result is copied back to the CPU.</p>

<div class="code-block">
  <span class="code-label">sobel.cu (from PDF case study)</span>
  <pre><span class="kw">__global__</span> <span class="type">void</span> <span class="fn">sobelEdgeDetection</span>(<span class="kw">const</span> <span class="type">unsigned</span> <span class="type">char</span>* inputImage, <span class="type">unsigned</span> <span class="type">char</span>* outputImage, <span class="type">int</span> width, <span class="type">int</span> height) {

    }
}</pre>

<h2>Phase 1: The Reduction (Upsweep) Phase</h2>
<p>In the upsweep phase, the algorithm builds a balanced binary tree of partial sums bottom-up. Threads perform pairwise additions at increasing strides (1, 2, 4, …, N/2), storing intermediate sums in parent nodes.</p>

<div class="diagram-box">
  <div class="diagram-title">Upsweep (Reduction) Phase — Building Partial Sums</div>

    </div>
  </div>
</div>

<h2>Phase 2: The Distribution (Downsweep) Phase</h2>
<p>In the downsweep phase, the algorithm traverses back down the tree from the root, introducing the identity element (0 for addition) at the root and distributing partial sums to compute the final prefix values.</p>

<h2>1. What is Dynamic Parallelism?</h2>
<p>Dynamic parallelism is a feature in certain GPUs that allows kernels (GPU functions) to create new kernels and launch them from within the original kernel. This enables <strong>nested parallelism</strong>, where GPU threads can spawn additional work without returning to the CPU, allowing more flexible and fine-grained parallel computations.</p>

      <div class="dp-node"><strong>Child Y</strong></div>
      <div class="dp-node"><strong>Child Z</strong></div>

    </div>

  <div style="text-align:center; margin-top:10px; font-size:11px; color:var(--text-tertiary);">All without CPU involvement — parent can consume child output via cudaDeviceSynchronize()</div>
</div>

<h2>2. Advantages of Dynamic Parallelism</h2>
<ul>
  <li><strong>Adaptive Parallelism:</strong> GPU dynamically adjusts the amount of parallelism based on the workload — useful for irregular and unpredictable tasks.</li>
  <li><strong>Recursive Algorithms:</strong> Tree traversals or graph algorithms benefit from recursion; CDP allows these to be implemented directly on the GPU without flattening recursion into iterative loops.</li>
  <li><strong>Hierarchical Computations:</strong> Algorithms with hierarchical structure (simulations, adaptive mesh refinement) can naturally exploit CDP.</li>
  <li><strong>Nested Data Structures:</strong> Each level of a hierarchy can be processed by a separate kernel.</li>
</ul>

<h2>3. Challenges and Overhead</h2>
<table>
  <tr><th>Overhead Type</th><th>Description</th></tr>
  <tr>
    <td><strong>Kernel Launch Overhead</strong></td>
    <td>Creating/launching new kernels involves context switching, parameter setup, memory allocation. Significant for small/short-lived child kernels.</td>
  </tr>
  <tr>
    <td><strong>Thread Block Management</strong></td>
    <td>GPU must manage/schedule additional thread blocks for child kernels — bookkeeping and resource allocation overhead.</td>
  </tr>
  <tr>
    <td><strong>Synchronization Overhead</strong></td>
    <td>Coordinating parent and child kernels introduces idle time for threads waiting on others.</td>
  </tr>
  <tr>
    <td><strong>Data Movement Overhead</strong></td>
    <td>Complex memory access patterns and data dependencies can cause increased data movement and cache thrashing.</td>
  </tr>
  <tr>
    <td><strong>Workload Imbalance</strong></td>
    <td>Some child kernels generate more work than others → underutilization.</td>
  </tr>
  <tr>
    <td><strong>Recursive Algorithm Overhead</strong></td>
    <td>Recursive algorithms can generate an excessive number of child kernels, multiplying overhead.</td>
  </tr>
</table>

<h2>4. Mitigation Strategies (from PDF)</h2>
<ul>
  <li><strong>Kernel Fusion:</strong> Combine multiple small kernels into a single kernel to reduce launch overhead and memory access overhead.</li>
  <li><strong>Recursive Depth Limit:</strong> Set a limit on recursion depth to avoid excessive child kernel generation.</li>
  <li><strong>Asynchronous Execution:</strong> Utilize async execution and overlapping techniques to minimize idle time.</li>
  <li><strong>Load Balancing:</strong> Distribute workload evenly across thread blocks.</li>
  <li><strong>Profiling and Optimization:</strong> Profile to identify where CDP adds significant overhead; benchmark different approaches.</li>
</ul>

<h2>5.3 Programming Heterogeneous Cluster</h2>
<p>A heterogeneous cluster consists of different processing units — CPUs, GPUs, FPGAs, and specialized accelerators. Programming such clusters requires:</p>
<ul>
  <li><strong>Identify Hardware Resources:</strong> Understand the number and type of CPUs, GPUs, and accelerators.</li>
  <li><strong>Choose Parallel Programming Models:</strong> OpenMP for multicore CPUs, CUDA for NVIDIA GPUs, OpenCL for heterogeneous computing.</li>
  <li><strong>Task Partitioning and Load Balancing:</strong> Divide computation into smaller units; distribute across resources; ensure balanced load.</li>
  <li><strong>Data Management:</strong> Minimize transfers between processing units; use shared memory, P2P communication, data locality.</li>
  <li><strong>Use Libraries and APIs:</strong> Leverage specialized libraries optimized for different hardware.</li>
  <li><strong>Performance Profiling and Optimization:</strong> Profile to identify bottlenecks; optimize based on results.</li>
  <li><strong>Asynchronous Execution:</strong> Overlap computation and communication for tasks with varying computational times.</li>
  <li><strong>Error Handling and Fault Tolerance:</strong> Robustness in heterogeneous environments.</li>
  <li><strong>Portability:</strong> Use abstraction layers; avoid hardware-specific optimizations where possible.</li>
</ul>

<h2>5.4 Performance — Synchronization</h2>
<p>Performance synchronization manages coordination/communication between threads or processes. Goal: minimize sync overhead while maintaining correctness and scalability.</p>
<ul>
  <li><strong>Avoid Unnecessary Synchronization:</strong> Only sync when required for correctness; minimize global locks/barriers.</li>
  <li><strong>Fine-Grained Synchronization:</strong> Use multiple smaller locks or lock-free data structures instead of one global lock.</li>
  <li><strong>Lock Hierarchies:</strong> Establish consistent lock acquisition order to prevent deadlocks.</li>
  <li><strong>Asynchronous Communication:</strong> Non-blocking communication to overlap computation and communication.</li>
  <li><strong>Data Locality:</strong> Optimize data layout to maximize cache efficiency and reduce sync needs.</li>
  <li><strong>Read-Write Synchronization:</strong> Differentiate reads (concurrent-safe) from writes (require locking).</li>
  <li><strong>Lock-Free / Wait-Free Algorithms:</strong> Reduce sync overhead in high-contention scenarios.</li>
  <li><strong>Memory Barriers:</strong> Use judiciously to enforce ordering constraints.</li>
  <li><strong>Load Balancing:</strong> Essential to prevent threads idling on others.</li>
  <li><strong>Scalability:</strong> Techniques that work on small thread counts may not scale.</li>
  <li><strong>Profiling and Benchmarking:</strong> Identify sync hotspots; benchmark different strategies.</li>
</ul>

<h2>5.6 Restrictions and Limitations of GPU Algorithms</h2>
<ul>
  <li><strong>Data Dependencies:</strong> GPUs perform best on data-parallel computations; strong dependencies / irregular access patterns limit gains.</li>
  <li><strong>Memory Constraints:</strong> Limited on-chip memory (registers, shared memory) and limited global memory bandwidth.</li>
  <li><strong>Thread Divergence:</strong> Threads in a block execute in lockstep; divergent paths reduce efficiency.</li>
  <li><strong>Kernel Launch Overhead:</strong> Significant for small/short-lived computations.</li>
  <li><strong>Branching and Conditionals:</strong> Branch divergence hurts performance; prefer branch-free algorithms.</li>
  <li><strong>Synchronization:</strong> Excessive sync, especially across thread blocks, serializes execution.</li>
  <li><strong>Limited Double-Precision Support:</strong> Historically slower than single-precision on consumer GPUs.</li>
  <li><strong>Device-Specific Optimization:</strong> Different architectures may need different tuning.</li>
  <li><strong>Host-Device Data Transfer:</strong> PCIe transfers add overhead; minimize transfers.</li>
  <li><strong>Power and Thermal Constraints:</strong> High-performance GPUs consume significant power and generate heat.</li>
</ul>

<h2>5.7 Runtime-Memory Footprint</h2>
<p>Runtime-memory footprint = memory used during execution. Includes:</p>
<ul>
  <li><strong>Static Memory Footprint:</strong> Determined at compile time — global variables, static data structures, constants, executable code. Typically fixed.</li>
  <li><strong>Dynamic Memory Footprint:</strong> Used during execution; varies — heap allocations (malloc/new) and stack (local variables, function call data).</li>
</ul>
<h3>Key Considerations</h3>
<ul>
  <li><strong>Memory Allocation and Deallocation:</strong> Proper management prevents leaks, fragmentation, and overhead.</li>
  <li><strong>Memory Leaks:</strong> Allocated but not freed; gradual increase in memory usage.</li>
  <li><strong>Fragmentation:</strong> Non-contiguous allocation/deallocation leads to inefficient memory use.</li>
  <li><strong>Data Structures:</strong> Choice impacts footprint; efficient structures improve cache locality.</li>
  <li><strong>Stack and Heap Usage:</strong> Stack overflow vs heap fragmentation trade-offs.</li>
  <li><strong>Data Sharing and Copying:</strong> Sharing reduces footprint; copying increases it.</li>
  <li><strong>Caching:</strong> Efficient cache use reduces access times.</li>
  <li><strong>Garbage Collection:</strong> In GC languages (Java/C#), efficient GC strategy maintains stable footprint.</li>
</ul>

<h2>5.8 Nesting and Synchronization Depth</h2>
<h3>Nesting Depth</h3>
<p>The number of levels of nested parallel computations within a program. A higher-level task spawns multiple lower-level tasks, which can spawn their own. High nesting depth is common in recursive or divide-and-conquer algorithms. Allows expressive algorithm design but introduces load balancing, resource management, and synchronization challenges.</p>
<h3>Synchronization Depth</h3>
<p>The level of synchronization points/barriers within a parallel computation. Excessive sync introduces bottlenecks — threads wait for others, causing idle time.</p>
<h3>Balancing Nesting and Sync Depth</h3>
<ul>
  <li><strong>Load Balancing:</strong> Even work distribution prevents idle time.</li>
  <li><strong>Minimize Synchronization:</strong> Use async communication or lock-free techniques.</li>
  <li><strong>Task Granularity:</strong> Choose appropriate task size.</li>
  <li><strong>Optimized Data Access:</strong> Minimize data movement; improve cache efficiency.</li>
  <li><strong>Profiling and Tuning:</strong> Analyze behavior; identify bottlenecks.</li>
  <li><strong>Hybrid Approaches:</strong> Combine multi-threading with multi-processing or GPU acceleration.</li>
</ul>

<h2>5.9 Pending Kernel Launches</h2>
<p>Pending kernel launches occur when a GPU kernel cannot start immediately due to resource limitations or dependencies. The kernel is placed in a <strong>pending queue</strong>.</p>
<h3>Causes</h3>
<ul>
  <li><strong>GPU Resource Availability:</strong> GPU already fully occupied with active kernels.</li>
  <li><strong>Synchronization Dependencies:</strong> Kernels with explicit dependencies wait on prior kernels.</li>
  <li><strong>Asynchronous Execution:</strong> Async kernels queued for later execution per GPU scheduling.</li>
  <li><strong>Dynamic Parallelism:</strong> Child kernels may queue until parent completes.</li>
  <li><strong>Concurrent Kernel Launches:</strong> On some architectures, multiple kernels launch concurrently; ordering influenced by scheduling policies.</li>
</ul>
<h3>Addressing Pending Launches</h3>
<ul>
  <li>Reduce kernel launch overhead — consolidate small kernels.</li>
  <li>Use asynchronous execution to overlap computation and communication.</li>
  <li>Optimize kernel dependencies — design algorithms to work independently.</li>
  <li>Efficient GPU resource management.</li>
  <li>Be cautious with dynamic parallelism; manage nested depth.</li>
  <li>Profile and tune; understand the specific GPU architecture.</li>
</ul>

<h2>5.10 Configuration Options</h2>
<ul>
  <li><strong>Thread Block Size and Grid Dimensions:</strong> Optimize thread utilization, memory access patterns, load balancing. Choice affects shared memory usage and register pressure.</li>
  <li><strong>Shared Memory Usage:</strong> Configure amount per block; reduce access latency; improve data reuse.</li>
  <li><strong>Memory Access Patterns:</strong> Use different memory spaces (global, shared, constant); optimize organization and alignment.</li>
  <li><strong>Parallelization Strategies:</strong> Data parallelism, task parallelism, or hybrid.</li>
  <li><strong>GPU Compute Capability:</strong> Tailor to specific features (warp shuffle, atomics).</li>
  <li><strong>Synchronization and Memory Barriers:</strong> Select appropriate sync mechanism.</li>
  <li><strong>Precision Settings:</strong> Single vs double precision based on accuracy needs.</li>
  <li><strong>Dynamic Parallelism:</strong> Control nested kernel depth.</li>
  <li><strong>SM Settings:</strong> Configure thread blocks per SM.</li>
  <li><strong>Memory Pooling and Caching:</strong> Custom pooling to minimize allocation overhead.</li>
</ul>

<h2>5.11 Memory Allocation and Lifetime</h2>
<h3>Memory Allocation</h3>
<ul>
  <li><strong>Data Placement:</strong> Decide what lives in global memory vs shared memory.</li>
  <li><strong>Static vs Dynamic Allocation:</strong> Static at compile time; dynamic at runtime.</li>
  <li><strong>Memory Alignment:</strong> Align data for efficient vectorized access.</li>
  <li><strong>Memory Coalescing:</strong> Optimize access patterns for coalescing.</li>
</ul>
<h3>Memory Lifetime</h3>
<ul>
  <li><strong>Explicit Deallocation:</strong> Programmer must free memory when no longer needed.</li>
  <li><strong>Automatic Memory Management:</strong> C++11 smart pointers reduce leak risk.</li>
  <li><strong>Scope and Visibility:</strong> Allocate within appropriate scope; align lifetime with computation needs.</li>
  <li><strong>Data Dependencies:</strong> Retain memory until dependent computations complete.</li>
  <li><strong>Memory Reuse:</strong> Pooling/caching to reuse memory across iterations/blocks.</li>
  <li><strong>Shared Memory Management:</strong> Limited resource; manage carefully to avoid contention.</li>
  <li><strong>Memory Transfer:</strong> Minimize host↔device transfers; use appropriate memory spaces.</li>
</ul>

<h2>Case Study: Accelerating Genetic Algorithms with GPU Computing</h2>
<p><em>Source: Unit V PDF — Case Study section.</em></p>

<h3>Background</h3>
<p>Genetic Algorithms (GAs) are optimization techniques inspired by natural selection. Their computational demands can be significant, particularly for large-scale problems. GPU computing parallelizes GA execution to achieve significant speedup.</p>

<h3>GA Components</h3>
<ul>
  <li><strong>Representation:</strong> Solutions encoded as genes/chromosomes.</li>
  <li><strong>Population:</strong> Set of potential solutions.</li>
  <li><strong>Fitness Evaluation:</strong> Each solution evaluated via objective function.</li>
  <li><strong>Selection:</strong> Fitter individuals more likely to be chosen.</li>
  <li><strong>Crossover:</strong> Exchange genetic information to create offspring.</li>
  <li><strong>Mutation:</strong> Random changes for diversity.</li>
  <li><strong>Termination:</strong> Fixed generations or criterion met.</li>
</ul>

<h3>GPU Acceleration</h3>
<p>The most computationally intensive step is <strong>fitness evaluation</strong> — perfect for GPU acceleration since each solution's fitness can be evaluated independently. The population is divided into blocks; each block is processed by different GPU threads. Other components (selection, crossover, mutation) can also be parallelized.</p>

<h3>Advantages</h3>
<ul>
  <li><strong>Increased Throughput:</strong> Faster convergence and shorter optimization times.</li>
  <li><strong>Scalability:</strong> Maintains efficiency as problem size increases.</li>
  <li><strong>Exploration of Complex Landscapes:</strong> Faster fitness evaluation enables deeper exploration.</li>
  <li><strong>Better Solution Quality:</strong> Broader range of solutions explored.</li>
</ul>

<h3>Challenges</h3>
<ul>
  <li><strong>Memory Management:</strong> Limited GPU memory; efficient management essential to avoid transfer bottlenecks.</li>
  <li><strong>Thread Divergence:</strong> Stochastic GA processes may cause divergence.</li>
  <li><strong>Algorithm Design:</strong> Not all GA operations parallelize efficiently; some remain sequential.</li>
</ul>

let currentUnit = 0;
let currentSection = 0;
let readSections = new Set();

function renderSidebar() {
  const nav = document.getElementById('sidebarNav');
  nav.innerHTML = '';
  courseData.units.forEach((unit, ui) => {
    const btn = document.createElement('button');
    btn.className = 'unit-btn' + (ui === currentUnit ? ' active' : '');
    btn.innerHTML = unit.title + '<span class="ch">▸</span>';
    btn.onclick = () => { currentUnit = ui; currentSection = 0; renderSidebar(); renderContent(); };
    nav.appendChild(btn);
    const list = document.createElement('div');
    list.className = 'sec-list' + (ui === currentUnit ? ' open' : '');
    unit.sections.forEach((sec, si) => {
      const link = document.createElement('a');
      link.className = 'sec-link' + (ui === currentUnit && si === currentSection ? ' active' : '');
      let tagHtml = '';
      if (sec.id.includes('mg') || sec.id.includes('nvcc') || sec.id.includes('dp') || sec.id.includes('extra')) {
        tagHtml = '<span class="tag-mini new">NEW</span>';
      } else if (sec.id === 'u4q3' || sec.id === 'u4q8' || sec.id === 'u5q9' || sec.id === 'u5blelloch' || sec.id === 'u3q5') {
        tagHtml = '<span class="tag-mini fix">FIX</span>';
      }
      link.innerHTML = sec.title + tagHtml;
      link.onclick = (e) => { e.preventDefault(); currentUnit = ui; currentSection = si; renderSidebar(); renderContent(); };
      list.appendChild(link);
    });
    nav.appendChild(list);
  });
}

function renderContent() {
  const area = document.getElementById('contentArea');
  const unit = courseData.units[currentUnit];
  const sec = unit.sections[currentSection];
  let html = sec.content;
  const prevDisabled = currentUnit === 0 && currentSection === 0;
  const nextDisabled = currentUnit === courseData.units.length - 1 && currentSection === unit.sections.length - 1;
  let prevTarget = null, nextTarget = null;
  if (!prevDisabled) {
    if (currentSection > 0) prevTarget = [currentUnit, currentSection - 1];
    else prevTarget = [currentUnit - 1, courseData.units[currentUnit - 1].sections.length - 1];
  }
  if (!nextDisabled) {
    if (currentSection < unit.sections.length - 1) nextTarget = [currentUnit, currentSection + 1];
    else nextTarget = [currentUnit + 1, 0];
  }
  html += `<div class="top-nav">`;
  html += `<button class="nav-btn" ${prevDisabled ? 'disabled' : ''} onclick="${prevTarget ? `jumpTo(${prevTarget[0]},${prevTarget[1]})` : ''}">← Previous</button>`;
  html += `<span style="font-size:13px; color:var(--text-tertiary);">${currentSection + 1} of ${unit.sections.length}</span>`;
  html += `<button class="nav-btn" ${nextDisabled ? 'disabled' : ''} onclick="${nextTarget ? `jumpTo(${nextTarget[0]},${nextTarget[1]})` : ''}">Next →</button>`;
  html += `</div>`;
  if (currentSection === unit.sections.length - 1 && flashcardData[currentUnit]) {
    html += `<h2 style="margin-top:40px; font-size:20px;">Quick Review Flashcards</h2>`;
    html += `<p style="font-size:13px; color:var(--text-tertiary); margin-bottom:16px;">Click cards to reveal answers</p>`;
    flashcardData[currentUnit].forEach((card) => {
      html += `<div class="flashcard" onclick="this.classList.toggle('flipped')">
        <div class="fc-q">${card.q}</div>
        <div class="fc-a">${card.a}</div>
        <div class="fc-hint">Click to flip</div>
      </div>`;
    });
  }
  area.innerHTML = html;
  readSections.add(sec.id);
  updateProgress();
  window.scrollTo(0, 0);
}

function updateProgress() {
  const total = courseData.units.reduce((a, u) => a + u.sections.length, 0);
  const pct = Math.round((readSections.size / total) * 100);
  document.getElementById('progressBar').style.width = pct + '%';
  document.getElementById('progressText').textContent = pct + '% complete';
}

function jumpTo(ui, si) {
  currentUnit = ui; currentSection = si;
  renderSidebar(); renderContent();
}

function setupSearch() {
  const box = document.getElementById('searchBox');
  const res = document.getElementById('searchResults');
  box.addEventListener('input', (e) => {
    const q = e.target.value.toLowerCase().trim();
    if (!q) { res.style.display = 'none'; return; }
    const matches = [];
    courseData.units.forEach((u, ui) => {
      u.sections.forEach((s, si) => {
        const text = (s.title + ' ' + s.content.replace(/<[^>]+>/g, ' ')).toLowerCase();
        if (text.includes(q)) {
          const rawText = s.content.replace(/<[^>]+>/g, ' ');
          const idx = text.indexOf(q);
          const snippet = rawText.substring(Math.max(0, idx - 30), idx + 60);
          matches.push({ui, si, title: s.title, snippet: '...' + snippet + '...'});
        }
      });
    });
    if (!matches.length) { res.innerHTML = '<div class="search-result"><span style="color:var(--text-tertiary)">No results</span></div>'; }
    else {
      res.innerHTML = matches.map(m => `<div class="search-result" onclick="jumpTo(${m.ui},${m.si}); document.getElementById('searchResults').style.display='none'; document.getElementById('searchBox').value='';">
        <div class="sr-title">${m.title}</div>
        <div class="sr-snippet">${m.snippet}</div>
      </div>`).join('');
    }
    res.style.display = 'block';
  });
  document.addEventListener('click', (e) => {
    if (!box.contains(e.target) && !res.contains(e.target)) res.style.display = 'none';
  });
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('open');
}

renderSidebar();
renderContent();
setupSearch();
